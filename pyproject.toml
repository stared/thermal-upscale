[project]
name = "thermal-upscale"
version = "0.1.0"
description = "Upscale Thermal Master P3 thermal images by 4× using Upscayl, with optional raw-mode preprocessing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "pillow>=11",
    "numpy>=2",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[project.scripts]
thermal-upscale = "thermal_upscale.cli:main"

[project.optional-dependencies]
# Research/diagnostic scripts under scripts/ (σ optimization etc.).
research = [
    "torch>=2.11.0",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermal_upscale"]
